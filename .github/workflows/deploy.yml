name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # Trigger on push to the main branch

jobs:
  build:
    runs-on: ubuntu-latest  # Use Ubuntu as the build environment

    steps:
      # Step 1: Checkout code from GitHub
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'  # Use Python 3.9

      # Step 3: Install dependencies from requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Step 4: Run tests (Optional)
      - name: Run tests
        run: |
          python -m unittest discover tests/  # Run all tests in the 'tests' directory

      # Step 5: Build Docker image
      - name: Build Docker image
        run: |
          docker build -t devpatel09/diet-analysis:latest .  # Tag the image with your username and latest tag

      # Step 6: Log in to Docker Hub using the secrets you added to GitHub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}  # Uses your Docker Hub username stored in GitHub Secrets
          password: ${{ secrets.DOCKER_PASSWORD }}  # Uses your Docker Hub password stored in GitHub Secrets

      # Step 7: Push Docker image to Docker Hub
      - name: Push Docker image to Docker Hub
        run: |
          docker push devpatel09/diet-analysis:latest  # Ensure you push the image with the correct tag

      # Step 8: (Optional) Trigger deployment using SSH (if you want to simulate a deployment)
      # Uncomment and configure this section if you are deploying your Docker image
      # - name: Deploy to server (optional)
      #   run: |
      #     ssh user@server "docker pull devpatel09/diet-analysis:latest && docker run -d devpatel09/diet-analysis"


